services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: tb_terminal
      POSTGRES_USER: tb_terminal
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be supplied from a protected environment file}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tb_terminal -d tb_terminal"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: tb-terminal-service:1.0.0
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: production
      APP_VERSION: 1.0.0
      PORT: 8080
      DB_URL: jdbc:postgresql://postgres:5432/tb_terminal
      DB_USER: tb_terminal
      DB_PASSWORD: ${DB_PASSWORD:?required}
      DB_MAX_POOL_SIZE: ${DB_MAX_POOL_SIZE:-10}
      DB_MIN_IDLE: ${DB_MIN_IDLE:-2}
      DB_CONNECTION_TIMEOUT_MS: ${DB_CONNECTION_TIMEOUT_MS:-10000}
      JWT_SECRET: ${JWT_SECRET:?required}
      JWT_ISSUER: ${JWT_ISSUER:-tb-terminal}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-tb-terminal-client}
      JWT_ACCESS_TOKEN_MINUTES: ${JWT_ACCESS_TOKEN_MINUTES:-15}
      JWT_REFRESH_TOKEN_DAYS: ${JWT_REFRESH_TOKEN_DAYS:-7}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?HTTPS origin required}
      LOG_LEVEL: ${LOG_LEVEL:-WARN}
      STORE_NAME: ${STORE_NAME:?required}
      STORE_ADDRESS: ${STORE_ADDRESS:?required}
      STORE_PHONE: ${STORE_PHONE:?required}
      BOOTSTRAP_OWNER_PASSWORD: ${BOOTSTRAP_OWNER_PASSWORD:-}
      BOOTSTRAP_OWNER_PIN: ${BOOTSTRAP_OWNER_PIN:-}
      BACKUP_ENABLED: ${BACKUP_ENABLED:-true}
      BACKUP_DIRECTORY: /var/lib/tb-terminal/backups
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_MAX_UPLOAD_MB: ${BACKUP_MAX_UPLOAD_MB:-1024}
      PG_DUMP_EXECUTABLE: pg_dump
      PG_RESTORE_EXECUTABLE: pg_restore
      RESTORE_ENABLED: ${RESTORE_ENABLED:-false}
    volumes:
      - backup-data:/var/lib/tb-terminal/backups
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks: [internal]

  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ${TLS_CERT_DIR:?TLS_CERT_DIR required}:/etc/nginx/tls:ro
    networks: [internal]

networks:
  internal:
    driver: bridge

volumes:
  postgres-data:
  backup-data:

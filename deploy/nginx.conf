events { worker_connections 1024; }

http {
    limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=login_per_ip:10m rate=5r/m;
    limit_conn_zone $binary_remote_addr zone=connections_per_ip:10m;

    log_format structured escape=json '{"time":"$time_iso8601","requestId":"$request_id","remote":"$remote_addr","method":"$request_method","uri":"$uri","status":$status,"bytes":$body_bytes_sent,"duration":$request_time}';
    access_log /var/log/nginx/access.log structured;
    server_tokens off;

    upstream tb_terminal_backend { server backend:8080; keepalive 16; }

    server {
        listen 443 ssl http2;
        server_name _;
        ssl_certificate /etc/nginx/tls/fullchain.pem;
        ssl_certificate_key /etc/nginx/tls/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:10m;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;

        client_max_body_size 10m;
        limit_conn connections_per_ip 20;
        limit_req zone=api_per_ip burst=40 nodelay;

        location = /api/auth/login {
            limit_req zone=login_per_ip burst=2 nodelay;
            proxy_pass http://tb_terminal_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
        }

        location = /api/system/database-backups/restore/validate {
            client_max_body_size 1024m;
            proxy_read_timeout 1800s;
            proxy_send_timeout 1800s;
            proxy_pass http://tb_terminal_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
        }

        location / {
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_pass http://tb_terminal_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
        }
    }
}
